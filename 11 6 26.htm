<!DOCTYPE html><html lang="en" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JTNAAN Bulacan – Church Management</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b0a3a"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-badge-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JTNAAN">
<style>
:root{--bg:#0b0a3a;--card:#15145a;--tx:#fff;--mu:#b9bde6;--pr:#f2a93b;--bd:#3a3a9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:60px}
body{margin:0;background:radial-gradient(1000px 400px at 100% 0,#2a2aa8,transparent 60%),var(--bg) fixed;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px}header img{width:44px;height:44px;border-radius:50%}header b{text-transform:uppercase;letter-spacing:1px;font-size:14px}header small{display:block;color:var(--mu)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:#0b0a3af2;z-index:4}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:7px 12px;background:transparent;color:var(--tx);white-space:nowrap}
nav button{text-transform:uppercase;font-size:12px;letter-spacing:1px}nav button.on{background:var(--pr);color:#241a00;font-weight:700}
.btn{background:#3b3bd0;font-weight:700}.gold{background:var(--pr);color:#241a00}.red{background:#c0392b}.sm{padding:4px 9px;font-size:13px}
main{max-width:980px;margin:auto;padding:16px}
h2{font-style:italic;text-transform:uppercase;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#ffffff0f;border-left:3px solid #fff;border-radius:4px;padding:12px 14px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:6px}.card img.mimg{height:clamp(4.5rem,7vw,6.5rem)}
.stat{font-size:34px;font-weight:900;color:var(--pr)}.mu{color:var(--mu);font-size:14px}
input,textarea,select{width:100%;font:inherit;padding:8px;margin:3px 0;border:1px solid var(--bd);border-radius:8px;background:#0b0a3a;color:#fff}
.msd{margin:3px 0;border:1px solid var(--bd);border-radius:8px;background:#0b0a3a}.msd summary{cursor:pointer;padding:8px 10px;list-style:none;display:flex;justify-content:space-between;gap:8px}.msd summary::after{content:"▾";color:var(--mu)}.msd[open] summary::after{content:"▴"}.msd .ms-l{max-height:14rem;overflow:auto;padding:0 6px 6px}.msd .chk{margin:4px 0;padding:6px 10px;cursor:pointer}
.chk{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#ffffff0f;border-radius:6px;margin:5px 0}.chk input{width:auto}
.arit{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:#ffffff0d;user-select:none}.arit.drag{outline:2px solid var(--pr);background:#ffffff1f}.arh{cursor:grab;touch-action:none;font-size:20px;padding:2px 8px;color:var(--pr)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#modal>div{background:var(--card);padding:18px;border-radius:12px;width:100%;max-width:440px;max-height:90vh;overflow:auto}

/* Responsive: fluid type + full-width layout for phone, tablet, iPad, laptop, PC */
html{font-size:clamp(15px,.45vw + 13.3px,21px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:1rem}
header{padding:.6rem clamp(.75rem,2.5vw,2.5rem);gap:.7rem}header img{width:2.75rem;height:2.75rem}header b{font-size:.9rem}header small{font-size:.8rem}
nav{padding:0 clamp(.5rem,2.5vw,2.5rem) .5rem}nav button{font-size:.75rem;padding:.45rem .75rem}
button{padding:.45rem .75rem}.sm{padding:.25rem .55rem;font-size:.8rem}
main{max-width:1800px;width:100%;padding:clamp(.6rem,2.5vw,2.5rem)}
h2{font-size:clamp(1.3rem,1rem + 1.2vw,2.1rem)}h3{font-size:clamp(1.1rem,.95rem + .6vw,1.5rem)}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(15rem,100%),1fr));gap:clamp(.6rem,1.2vw,1.25rem)}
.card{padding:.75rem .9rem}.card img{height:clamp(9rem,12vw,16rem)}
.stat{font-size:clamp(1.8rem,1.2rem + 2vw,3rem)}.mu{font-size:.875rem}
#modal{padding:clamp(.5rem,2vw,1.5rem)}#modal>div{max-width:min(36rem,100%);padding:clamp(.9rem,2vw,1.5rem)}
img,svg,video,iframe{max-width:100%}table{font-size:.9rem}td,th{word-break:break-word}
@media (max-width:480px){table{font-size:.8rem}td,th{padding:4px!important}}
@media (min-width:1800px){main{padding-inline:3rem}}
/* About: use the full available width */
main:has(> .about){max-width:none}
.about{width:100%}
.about .lead{max-width:none;font-size:clamp(1rem,.9rem + .45vw,1.35rem);line-height:1.65;margin:.5rem 0 clamp(1rem,2vw,2rem)}
.about .grid{grid-template-columns:repeat(auto-fit,minmax(min(18rem,100%),1fr));gap:clamp(.75rem,1.6vw,1.75rem)}
.about .card{padding:clamp(1rem,1.8vw,2rem) clamp(1rem,2vw,2.25rem);display:flex;flex-direction:column;gap:.5rem}
.about .card b{font-size:clamp(1.1rem,.95rem + .6vw,1.6rem)}
.about .card .mu{font-size:clamp(.95rem,.85rem + .4vw,1.25rem);line-height:1.6;word-break:break-word}
/* Bible Trivia (Daily Devotion) */
.tv{max-width:44rem;margin:0 auto clamp(1rem,2vw,1.6rem);background:linear-gradient(160deg,#1d1c6e,#121150);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #0006}
.tvh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;flex-wrap:wrap}.tvh b{color:var(--pr);letter-spacing:1px;text-transform:uppercase;font-size:.95rem}.tvh .mu{font-size:.78rem}
.tvi{position:relative;aspect-ratio:16/9;background:linear-gradient(110deg,#24237a 30%,#33329a 50%,#24237a 70%) 0 0/300% 100%;animation:tvsh 1.6s linear infinite}

.tvi.noimg{animation:none;background:radial-gradient(circle at 30% 20%,#f2a93b55,transparent 55%),linear-gradient(135deg,#2a2aa8,#0b0a3a)}.tvi.noimg img{display:none}.tvi.noimg .tvph{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;font-size:clamp(3.5rem,10vw,6rem)}
.tvi.ok{animation:none}
@keyframes tvsh{to{background-position:-150% 0}}
.tvtag{position:absolute;left:12px;top:12px;background:#0b0a3acc;color:var(--pr);font-size:.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.tvc{padding:12px 14px 14px}.tvc h3{margin:0 0 4px;font-size:clamp(1.05rem,.95rem + .5vw,1.35rem)}.tvc p{margin:0;color:#dfe2ff;line-height:1.55}
.tq{border-top:1px solid var(--bd);padding:14px;background:#0b0a3a66}.tq .tqh{color:var(--pr);font-weight:700;font-size:.8rem;letter-spacing:1px;text-transform:uppercase}.tq .tqq{margin:4px 0 10px;font-weight:600;font-size:1.05rem}
.tqo{display:grid;gap:8px}.tqo button{display:flex;align-items:center;gap:10px;text-align:left;white-space:normal;width:100%;padding:10px 12px;border-radius:10px;background:#ffffff10;border:2px solid transparent;transition:background .15s,border-color .15s,transform .1s}
.tqo button:not(:disabled):hover{background:#ffffff1f;border-color:#ffffff40}.tqo button:not(:disabled):active{transform:scale(.99)}.tqo button:disabled{cursor:default}
.tqo .l{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;background:var(--pr);color:#241a00;font-weight:800;text-transform:uppercase}
.tqo button.ok{border-color:#2ecc71;background:#2ecc7122}.tqo button.ok .l{background:#2ecc71;color:#05210f}
.tqo button.no{border-color:#e74c3c;background:#e74c3c22}.tqo button.no .l{background:#e74c3c;color:#fff}
.tqr{margin-top:10px;font-weight:600}.tqr.ok{color:#5be08f}.tqr.no{color:#ff8a7d}.tqr .mu{font-weight:400}
.tvs{margin-top:clamp(1rem,2vw,1.6rem)}.tqs .tq{border-top:0}
#cfx{position:fixed;inset:0;pointer-events:none;z-index:20}
/* Daily Devotion / Testimony posts */
.feed{display:grid;gap:clamp(.8rem,1.5vw,1.4rem);max-width:44rem;margin-inline:auto}
.post{background:#242526;border-radius:12px;overflow:hidden;color:#e4e6eb}
.post .ph{padding:10px 12px;display:flex;gap:10px;align-items:center}.post .ph img{width:2.5rem;height:2.5rem;border-radius:50%}
.post>img{width:100%;max-height:36rem;object-fit:cover;display:block;cursor:zoom-in}
.post .cap{padding:4px 12px 10px;white-space:pre-wrap;word-break:break-word}
.rx{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-top:1px solid #3e4042;border-bottom:1px solid #3e4042}
.rx button{background:#3a3b3c;color:#e4e6eb}.rx button.on{background:#2d5bd0;font-weight:700}.rx button.on.ht{background:#c0395b}.rx .mu{margin-left:auto}
.cm{padding:8px 12px 12px}.cmi{background:#3a3b3c;border-radius:12px;padding:6px 10px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.cmi .mu{font-size:.75rem}.cmf{margin-top:8px}.cmf input,.cmf textarea{background:#18191a;border-color:#3e4042}
/* Donation QR */
.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.qr{background:#ffffff0f;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.qr img,.card .qr img{width:100%;max-width:18rem;height:auto;max-height:22rem;object-fit:contain;background:#fff;padding:8px;border-radius:10px;cursor:zoom-in;align-self:center}
/* Hamburger menu + slide-in section drawer */

html{overflow-x:hidden}body{overflow-x:clip}

body.mo #mnb i:nth-child(1){transform:translateY(7px) rotate(45deg)}body.mo #mnb i:nth-child(2){opacity:0}body.mo #mnb i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
nav#nav{position:fixed;left:0;top:var(--hh);bottom:0;width:var(--nw);display:flex;flex-direction:column;gap:3px;overflow-y:auto;overflow-x:hidden;padding:.75rem .6rem calc(1rem + env(safe-area-inset-bottom,0px));border:0;border-right:1px solid var(--bd);background:#0b0a3af7;z-index:5;transform:translateX(-100%);visibility:hidden;transition:transform .4s var(--ez),visibility 0s linear .4s;box-shadow:none}
body.mo nav#nav{transform:none;visibility:visible;transition:transform .4s var(--ez),visibility 0s;box-shadow:6px 0 24px #0006}
nav#nav button{text-align:left;width:100%;padding:.65rem .85rem;font-size:.8rem;border-radius:8px;flex:none;transition:background .2s}
nav#nav button:hover{background:#ffffff14}nav#nav button.on{background:var(--pr);color:#241a00}
main{transition:margin-left .4s var(--ez),transform .4s var(--ez),max-width .4s var(--ez)}
@media (min-width:760px){body.mo main{margin-left:var(--nw);max-width:calc(100% - var(--nw))}}
